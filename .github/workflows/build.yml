name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: Crosshair
          path: target/release/crosshair.exe
      - name: Package zip
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/crosshair.exe dist/
          @(
            'Crosshair'
            ''
            'Double-click crosshair.exe to start. No installation needed.'
            'Double-click the tray icon to open the settings.'
            ''
            'If Windows shows "Windows protected your PC": click More info -> Run anyway.'
            'Your game must run in Borderless or Windowed mode.'
            ''
            'More info: https://github.com/${{ github.repository }}'
          ) | Set-Content dist/README.txt -Encoding utf8
          Compress-Archive -Path dist/* -DestinationPath Crosshair-windows.zip
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/crosshair.exe
            Crosshair-windows.zip
          generate_release_notes: true
